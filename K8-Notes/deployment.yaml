# 📘 Detailed Notes: Day-34 | Kubernetes Deployment | ReplicaSets

**Video**: Abhishek Veeramalla Free DevOps Course (YouTube)


This video bridges the gap from basic Pods to production-ready Kubernetes by introducing ReplicaSets and Deployments.

---

## 📌 Key Learning Outcomes

* Deployment vs ReplicaSet vs Pod
* Auto-healing
* Hands-on demo (create, scale, delete, auto-recover)

---

# 🧠 1. Core Concepts

## 🔹 Why Pods Alone Are Not Enough

* A Pod is the smallest deployable unit
* If a Pod dies (crash, node failure, manual delete), it stays dead
* No automatic scaling
* No rolling updates
* No self-healing

---

## 🔹 ReplicaSet (RS) – The “keeper of desired state”

* Ensures a specific number of Pod replicas are always running
* If a Pod dies → ReplicaSet instantly creates a new one (auto-healing)
* If you scale up/down → ReplicaSet creates/deletes Pods

👉 ReplicaSet is not meant to be used directly in real life (low-level)

---

## 🔹 Deployment – The recommended high-level object

A Deployment manages a ReplicaSet (and therefore the Pods).

### When you create a Deployment:

* It creates a ReplicaSet
* The ReplicaSet creates the Pods

### Extra superpowers:

* Rolling updates (zero-downtime deployments)
* Rollbacks
* Pause/resume
* History of revisions

---

## 📊 Quick Comparison Table

| Feature           | Pod                          | ReplicaSet           | Deployment                          |
| ----------------- | ---------------------------- | -------------------- | ----------------------------------- |
| Self-healing      | No                           | Yes                  | Yes (via ReplicaSet)                |
| Scaling           | Manual only                  | Yes                  | Yes (preferred)                     |
| Rolling updates   | No                           | No                   | Yes                                 |
| Rollback          | No                           | No                   | Yes                                 |
| How you create it | `kubectl create -f pod.yaml` | Rarely used directly | `kubectl create -f deployment.yaml` |
| Real-world usage  | Rarely                       | Almost never         | 99% of production workloads         |

---

# 🧾 2. YAML for Deployment

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 3                    # desired number of Pods
  selector:
    matchLabels:
      app: nginx
  template:                      # Pod template
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
```

---

## 🔑 Important Points from Abhishek

* `spec.replicas` → tells ReplicaSet how many Pods to keep
* `spec.selector` + `template.metadata.labels` → how ReplicaSet identifies Pods
* The `template` section is the Pod spec from Day-33

---

# ⚙️ 3. Hands-on Demo Commands

| Step              | Command                                                  | What happens                             |
| ----------------- | -------------------------------------------------------- | ---------------------------------------- |
| Create Deployment | `kubectl create -f deployment.yaml`                      | Creates Deployment → ReplicaSet → 3 Pods |
| Check everything  | `kubectl get all`                                        | Shows Deployment, ReplicaSet, Pods       |
| See ReplicaSet    | `kubectl get rs`                                         | Shows the ReplicaSet                     |
| Scale             | `kubectl scale deployment nginx-deployment --replicas=5` | Creates more Pods                        |
| Auto-healing demo | `kubectl delete pod <pod-name>`                          | New Pod created instantly                |
| Check details     | `kubectl describe deployment nginx-deployment`           | Shows events and status                  |
| Delete everything | `kubectl delete deployment nginx-deployment`             | Deletes all resources                    |

---

## 💡 Pro Tips from Video

* Always use `kubectl get all` after any change
* Watch `READY` and `RESTARTS` columns
* New Pod appears in **< 1 second**
* Naming pattern:

  * Deployment → `nginx-deployment`
  * ReplicaSet → `nginx-deployment-abc123`
  * Pods → auto-generated

---

# 🔄 4. Auto-Healing in Action

* Deployment running with 3 Pods
* Delete one Pod manually
* ReplicaSet detects mismatch
* New Pod is created instantly

👉 Desired state is always maintained

