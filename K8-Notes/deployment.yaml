# 🧾 2. Deployment YAML

```yaml id="5trz42"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 3                    # desired number of Pods
  selector:
    matchLabels:
      app: nginx
  template:                      # Pod template
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
```

---

## 🔑 Important Points

* `spec.replicas` → Number of Pods to maintain
* `spec.selector` + `labels` → How ReplicaSet identifies Pods
* `template` → Same Pod spec from Day-33

