# ⚙️ 3. Hands-on Commands

| Step              | Command                                                  | What Happens                             |
| ----------------- | -------------------------------------------------------- | ---------------------------------------- |
| Create Deployment | `kubectl create -f deployment.yaml`                      | Creates Deployment → ReplicaSet → 3 Pods |
| Check everything  | `kubectl get all`                                        | Shows all resources                      |
| View ReplicaSet   | `kubectl get rs`                                         | Shows created ReplicaSet                 |
| Scale             | `kubectl scale deployment nginx-deployment --replicas=5` | Adds 2 Pods                              |
| Auto-healing demo | `kubectl delete pod <pod-name>`                          | New Pod created instantly                |
| Check details     | `kubectl describe deployment nginx-deployment`           | Shows events & status                    |
| Delete all        | `kubectl delete deployment nginx-deployment`             | Removes everything                       |

---

## 💡 Pro Tips

* Always use `kubectl get all` after changes
* Observe `READY` and `RESTARTS` columns
* Pod recreation happens in **< 1 second**
* Naming pattern:

  * Deployment → `nginx-deployment`
  * ReplicaSet → `nginx-deployment-abc123`
  * Pods → auto-generated names

